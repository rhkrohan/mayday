<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayday — Dispatch Intelligence</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --white: #ffffff;
            --gray-100: #f5f5f5;
            --gray-200: #e5e5e5;
            --gray-400: #a3a3a3;
            --gray-500: #737373;
            --gray-600: #525252;
            --gray-700: #404040;
            --gray-800: #262626;
            --gray-900: #171717;
            --red: #ef4444;
            --red-dark: #dc2626;
            --orange: #f97316;
            --orange-dark: #ea580c;
            --blue: #3b82f6;
            --blue-dark: #2563eb;
            --green: #22c55e;
            --green-dark: #16a34a;
            --purple: #a855f7;
            --purple-dark: #9333ea;
            --yellow: #eab308;
            --cyan: #06b6d4;
            --glass-bg: rgba(0, 0, 0, 0.78);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--black);
            color: var(--white);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==================== MAP ==================== */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(0.85) contrast(1.2) saturate(0.2);
        }

        .leaflet-control-attribution { display: none; }

        .leaflet-control-zoom {
            border: none !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4) !important;
            margin-bottom: 100px !important;
            margin-right: 20px !important;
            margin-left: auto !important;
        }

        .leaflet-control-zoom a {
            background: rgba(0,0,0,0.85) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            color: var(--white) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            width: 38px !important;
            height: 38px !important;
            line-height: 38px !important;
            font-size: 17px !important;
        }

        .leaflet-control-zoom a:first-child {
            border-radius: 12px 12px 0 0 !important;
        }

        .leaflet-control-zoom a:last-child {
            border-radius: 0 0 12px 12px !important;
        }

        .leaflet-control-zoom a:hover {
            background: rgba(30,30,30,0.95) !important;
        }

        /* ==================== ANIMATIONS ==================== */
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        @keyframes panic-pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes panic-ring {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        @keyframes card-enter {
            from { opacity: 0; transform: translateY(-12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ==================== TOP BAR ==================== */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 50%, rgba(0,0,0,0.4) 80%, transparent 100%);
            pointer-events: none;
        }

        .top-bar > * { pointer-events: auto; }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            box-shadow: 0 2px 12px rgba(255,255,255,0.15);
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo-sub {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: var(--white);
            opacity: 0.7;
            margin-left: 12px;
            font-weight: 500;
        }

        .top-center {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.alert {
            background: var(--red);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--white);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--glass-hover);
            border-color: rgba(255,255,255,0.18);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn.danger {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn.danger:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.5);
        }

        .btn.simulate {
            border-color: rgba(34, 197, 94, 0.3);
        }

        .btn.simulate:hover {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.5);
        }

        .btn.simulate.active {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.6);
            color: var(--green);
        }

        /* ==================== STATS BAR ==================== */
        .stats-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 3px;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 5px;
            border-radius: 22px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 17px;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .stat-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .stat-item.active {
            background: var(--white);
            color: var(--black);
        }

        .stat-item.active .stat-label {
            opacity: 0.5;
        }

        .stat-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
        }

        .stat-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .stat-content {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.45;
            margin-top: 1px;
            font-weight: 500;
        }

        /* ==================== RIGHT PANEL (LIVE FEED) ==================== */
        .right-panel {
            position: absolute;
            top: 72px;
            right: 20px;
            bottom: 90px;
            width: 360px;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }

        .right-panel.collapsed {
            transform: translateX(calc(100% + 30px));
            opacity: 0;
            pointer-events: none;
        }

        .panel-header {
            padding: 16px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title .count-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 7px;
            background: rgba(255,255,255,0.12);
            border-radius: 8px;
            font-variant-numeric: tabular-nums;
        }

        .panel-close {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--white);
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.15s;
        }

        .panel-close:hover {
            background: rgba(255,255,255,0.15);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            scroll-behavior: smooth;
        }

        .panel-content::-webkit-scrollbar {
            width: 4px;
        }

        .panel-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 4px;
        }

        /* Message cards */
        .msg-card {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            animation: card-enter 0.3s ease forwards;
        }

        .msg-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }

        .msg-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .msg-type-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 3px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .msg-type-badge.panic { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .msg-type-badge.incident-report { background: rgba(249,115,22,0.2); color: #fdba74; }
        .msg-type-badge.witness-confirm { background: rgba(34,197,94,0.2); color: #86efac; }
        .msg-type-badge.security-response { background: rgba(59,130,246,0.2); color: #93c5fd; }
        .msg-type-badge.security-status { background: rgba(59,130,246,0.2); color: #93c5fd; }
        .msg-type-badge.sos { background: rgba(239,68,68,0.25); color: #fca5a5; }
        .msg-type-badge.triage { background: rgba(249,115,22,0.2); color: #fdba74; }
        .msg-type-badge.shelter { background: rgba(59,130,246,0.2); color: #93c5fd; }
        .msg-type-badge.missing-person { background: rgba(168,85,247,0.2); color: #d8b4fe; }
        .msg-type-badge.broadcast { background: rgba(34,197,94,0.2); color: #86efac; }

        .msg-time {
            font-size: 10px;
            opacity: 0.35;
            font-variant-numeric: tabular-nums;
        }

        .msg-sender {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .security-shield {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            background: rgba(59,130,246,0.25);
            border-radius: 4px;
            font-size: 9px;
        }

        .msg-body {
            font-size: 12px;
            opacity: 0.55;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .severity-badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        .severity-low { background: rgba(34,197,94,0.2); color: #86efac; }
        .severity-med { background: rgba(249,115,22,0.2); color: #fdba74; }
        .severity-high { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .severity-crit { background: rgba(239,68,68,0.35); color: #fca5a5; }

        /* ==================== LEFT PANEL (SECURITY & PANICS) ==================== */
        .left-panel {
            position: absolute;
            top: 72px;
            left: 20px;
            bottom: 90px;
            width: 320px;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }

        .left-panel.collapsed {
            transform: translateX(calc(-100% - 30px));
            opacity: 0;
            pointer-events: none;
        }

        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            opacity: 0.35;
            font-weight: 600;
            padding: 14px 16px 8px;
        }

        .guard-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            transition: background 0.15s;
            cursor: pointer;
        }

        .guard-card:hover {
            background: rgba(255,255,255,0.05);
        }

        .guard-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .guard-avatar.on-duty {
            background: rgba(59,130,246,0.2);
            border: 1px solid rgba(59,130,246,0.3);
        }

        .guard-avatar.responding {
            background: rgba(249,115,22,0.2);
            border: 1px solid rgba(249,115,22,0.3);
        }

        .guard-avatar.off-duty {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .guard-info {
            flex: 1;
            min-width: 0;
        }

        .guard-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .guard-status {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .guard-status.on-duty { color: var(--blue); }
        .guard-status.responding { color: var(--orange); }
        .guard-status.off-duty { opacity: 0.35; }

        .panic-card {
            margin: 6px 12px;
            padding: 12px 14px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.15);
            border-left: 3px solid var(--red);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .panic-card.viewed {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-left: 3px solid rgba(255,255,255,0.15);
        }

        .panic-card:hover {
            background: rgba(239,68,68,0.12);
            border-color: rgba(239,68,68,0.25);
        }

        .panic-card.viewed:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.15);
        }

        .panic-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .panic-type {
            font-size: 12px;
            font-weight: 600;
            color: #fca5a5;
        }

        .panic-severity {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(239,68,68,0.25);
            color: #fca5a5;
        }

        .panic-meta {
            display: flex;
            gap: 12px;
            font-size: 10px;
            opacity: 0.55;
        }

        .panic-meta span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .left-panel-scroll {
            flex: 1;
            overflow-y: auto;
        }

        .left-panel-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .left-panel-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .left-panel-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.12);
            border-radius: 4px;
        }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 4px 0;
        }

        /* ==================== TOGGLE BUTTONS ==================== */
        .toggle-btn {
            position: absolute;
            z-index: 999;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            background: rgba(30,30,30,0.95);
            transform: translateY(-50%) scale(1.08);
        }

        .toggle-right {
            right: 392px;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s;
        }

        .toggle-right.shifted {
            right: 20px;
        }

        .toggle-left {
            left: 352px;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.15s;
        }

        .toggle-left.shifted {
            left: 20px;
        }

        /* ==================== MAP MARKERS ==================== */
        .panic-marker {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panic-marker-inner {
            width: 42px;
            height: 42px;
            background: var(--red);
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            color: white;
            animation: panic-pulse 1.5s infinite;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 20px rgba(239,68,68,0.5);
        }

        .panic-marker-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 42px;
            height: 42px;
            border: 2px solid rgba(239,68,68,0.6);
            border-radius: 50%;
            animation: panic-ring 2s infinite;
            z-index: 1;
        }

        .panic-witness-badge {
            position: absolute;
            top: -6px;
            right: -10px;
            background: var(--green);
            color: white;
            font-size: 9px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0,0,0,0.6);
            z-index: 3;
        }

        .incident-marker {
            width: 30px;
            height: 30px;
            background: var(--orange);
            border-radius: 50%;
            border: 2.5px solid rgba(255,255,255,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 3px 12px rgba(249,115,22,0.4);
        }

        .security-marker {
            position: relative;
        }

        .shield-shape {
            width: 34px;
            height: 38px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shield-shape svg {
            width: 34px;
            height: 38px;
            filter: drop-shadow(0 3px 8px rgba(59,130,246,0.5));
        }

        .shield-label {
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            font-weight: 700;
            white-space: nowrap;
            background: rgba(0,0,0,0.75);
            padding: 1px 5px;
            border-radius: 4px;
            color: #93c5fd;
            letter-spacing: 0.3px;
        }

        .witness-marker {
            width: 22px;
            height: 22px;
            background: var(--green);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            box-shadow: 0 2px 8px rgba(34,197,94,0.4);
        }

        .sos-marker {
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-bottom: 28px solid var(--red);
            filter: drop-shadow(0 3px 8px rgba(239,68,68,0.5));
            position: relative;
        }

        .sos-marker-label {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 900;
            color: white;
        }

        .triage-marker {
            width: 28px;
            height: 28px;
            background: var(--orange);
            border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 3px 10px rgba(249,115,22,0.4);
            transform: rotate(45deg);
        }

        .triage-marker span {
            transform: rotate(-45deg);
        }

        .shelter-marker {
            width: 28px;
            height: 28px;
            background: var(--blue);
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(59,130,246,0.4);
        }

        .missing-marker {
            width: 28px;
            height: 28px;
            background: var(--purple);
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(168,85,247,0.4);
        }

        .broadcast-marker {
            width: 28px;
            height: 28px;
            background: var(--green);
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            box-shadow: 0 3px 10px rgba(34,197,94,0.4);
        }

        /* ==================== POPUPS ==================== */
        .leaflet-popup-content-wrapper {
            background: rgba(0,0,0,0.92) !important;
            color: var(--white) !important;
            border-radius: 16px !important;
            padding: 0 !important;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
        }

        .leaflet-popup-content {
            margin: 0 !important;
            font-family: inherit !important;
        }

        .leaflet-popup-tip {
            background: rgba(0,0,0,0.92) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
        }

        .leaflet-popup-close-button {
            color: rgba(255,255,255,0.5) !important;
            font-size: 18px !important;
            padding: 6px 8px !important;
        }

        .popup-inner {
            padding: 16px;
            min-width: 220px;
            max-width: 280px;
        }

        .popup-type-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .popup-type-tag {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.12);
        }

        .popup-type-tag.panic { background: rgba(239,68,68,0.25); color: #fca5a5; }
        .popup-type-tag.incident-report { background: rgba(249,115,22,0.25); color: #fdba74; }
        .popup-type-tag.witness-confirm { background: rgba(34,197,94,0.25); color: #86efac; }
        .popup-type-tag.security-response { background: rgba(59,130,246,0.25); color: #93c5fd; }
        .popup-type-tag.sos { background: rgba(239,68,68,0.3); color: #fca5a5; }
        .popup-type-tag.triage { background: rgba(249,115,22,0.25); color: #fdba74; }
        .popup-type-tag.shelter { background: rgba(59,130,246,0.25); color: #93c5fd; }
        .popup-type-tag.missing-person { background: rgba(168,85,247,0.25); color: #d8b4fe; }
        .popup-type-tag.broadcast { background: rgba(34,197,94,0.25); color: #86efac; }

        .popup-timestamp {
            font-size: 10px;
            opacity: 0.35;
        }

        .popup-sender {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .popup-role {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.4;
            margin-bottom: 10px;
        }

        .popup-divider {
            height: 1px;
            background: rgba(255,255,255,0.08);
            margin: 10px 0;
        }

        .popup-detail-row {
            font-size: 12px;
            line-height: 1.6;
            margin: 4px 0;
        }

        .popup-detail-label {
            opacity: 0.4;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .popup-coords {
            font-size: 10px;
            opacity: 0.3;
            margin-top: 10px;
            font-family: 'SF Mono', Monaco, Menlo, monospace;
            background: rgba(255,255,255,0.04);
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* ==================== EMPTY STATE ==================== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            opacity: 0.3;
            padding: 40px 20px;
        }

        .empty-state-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .empty-state-text {
            font-size: 13px;
            font-weight: 500;
        }

        .empty-state-sub {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 1200px) {
            .left-panel { width: 280px; }
            .toggle-left { left: 312px; }
        }

        @media (max-width: 900px) {
            .left-panel, .toggle-left { display: none; }
            .right-panel { width: 300px; }
            .toggle-right { right: 332px; }
            .logo-sub { display: none; }
            .camera-panel { min-width: 400px; width: calc(100% - 360px - 40px); }
        }

        @media (max-width: 600px) {
            .right-panel { width: calc(100% - 40px); right: 20px; }
            .toggle-right { display: none; }
            .stats-bar { max-width: calc(100% - 32px); overflow-x: auto; }
            .camera-panel { min-width: unset; width: calc(100% - 40px); left: 20px; transform: none; }
        }

        /* ==================== INCIDENT DETAIL VIEW ==================== */
        .incident-detail { padding: 16px; }

        .incident-back {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px; background: rgba(255,255,255,0.08);
            border: none; border-radius: 8px; color: var(--white);
            font-size: 12px; font-weight: 500; cursor: pointer;
            margin-bottom: 14px; font-family: inherit;
            transition: background 0.15s;
        }
        .incident-back:hover { background: rgba(255,255,255,0.15); }

        .incident-header {
            padding: 16px; background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2); border-radius: 14px;
            margin-bottom: 14px;
        }
        .incident-header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .incident-type { font-size: 16px; font-weight: 700; color: #fca5a5; }
        .incident-sev { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 8px; background: rgba(239,68,68,0.3); color: #fca5a5; }
        .incident-sender { font-size: 13px; opacity: 0.7; margin-bottom: 4px; }
        .incident-time { font-size: 11px; opacity: 0.4; }
        .incident-desc { font-size: 13px; opacity: 0.8; margin-top: 8px; line-height: 1.5; }

        .incident-section {
            margin-bottom: 14px;
        }
        .incident-section-label {
            font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
            opacity: 0.35; font-weight: 600; margin-bottom: 8px;
        }
        .incident-transcript {
            padding: 12px; background: rgba(59,130,246,0.1);
            border: 1px solid rgba(59,130,246,0.2); border-radius: 12px;
            font-size: 13px; color: #93c5fd; line-height: 1.6;
        }
        .incident-transcript-label {
            font-size: 10px; font-weight: 700; color: #60a5fa;
            text-transform: uppercase; margin-bottom: 6px;
        }

        .incident-ai {
            padding: 12px; background: rgba(168,85,247,0.1);
            border: 1px solid rgba(168,85,247,0.2); border-radius: 12px;
        }
        .incident-ai-label {
            font-size: 10px; font-weight: 700; color: #a855f7;
            text-transform: uppercase; margin-bottom: 8px;
        }
        .incident-ai-threat {
            display: inline-block; padding: 3px 10px; border-radius: 6px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            color: #fff; margin-bottom: 8px;
        }
        .incident-ai-summary { font-size: 13px; color: #ddd6fe; line-height: 1.5; margin-bottom: 8px; }
        .incident-ai-response {
            padding: 8px 10px; background: rgba(168,85,247,0.15);
            border-radius: 8px; font-size: 12px; color: #c4b5fd;
        }
        .incident-ai-items { list-style: none; padding: 0; margin: 8px 0 0; }
        .incident-ai-items li {
            font-size: 12px; color: #c4b5fd; padding: 3px 0;
            display: flex; align-items: flex-start; gap: 6px;
        }
        .incident-ai-items li::before { content: '\25B8'; color: #a855f7; flex-shrink: 0; margin-top: 1px; }

        .incident-timeline { list-style: none; padding: 0; margin: 0; }
        .incident-timeline li {
            position: relative; padding: 8px 0 8px 20px;
            font-size: 12px; opacity: 0.7; border-left: 2px solid rgba(255,255,255,0.1);
        }
        .incident-timeline li::before {
            content: ''; position: absolute; left: -5px; top: 12px;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--gray-500); border: 2px solid var(--gray-800);
        }
        .incident-timeline li.panic::before { background: var(--red); }
        .incident-timeline li.witness-confirm::before { background: var(--green); }
        .incident-timeline li.security-response::before { background: var(--blue); }
        .incident-timeline li.incident-report::before { background: var(--orange); }
        .incident-tl-time { font-size: 10px; opacity: 0.4; }
        .incident-tl-sender { font-weight: 600; }

        .incident-cam-card {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; background: rgba(255,255,255,0.04);
            border-radius: 10px; margin-bottom: 6px; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.06); transition: all 0.15s;
        }
        .incident-cam-card:hover { background: rgba(255,255,255,0.08); }
        .incident-cam-icon {
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(239,68,68,0.15); display: flex;
            align-items: center; justify-content: center; font-size: 14px;
        }
        .incident-cam-name { font-size: 13px; font-weight: 600; }
        .incident-cam-dist { font-size: 11px; opacity: 0.4; }

        /* Camera Fullscreen Overlay */
        .camera-fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .camera-fullscreen-overlay video {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }
        .camera-fullscreen-overlay .fs-header {
            position: absolute;
            top: 24px; left: 32px; right: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .camera-fullscreen-overlay .fs-title {
            font-size: 16px; font-weight: 600; color: var(--white);
        }
        .camera-fullscreen-overlay .fs-close {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
            color: white; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .camera-fullscreen-overlay .fs-close:hover { background: rgba(255,255,255,0.2); }
        .camera-expand-btn {
            position: absolute; top: 8px; right: 8px;
            width: 28px; height: 28px; border-radius: 6px;
            background: rgba(0,0,0,0.6); border: none;
            color: white; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
            z-index: 2;
        }
        .camera-feed:hover .camera-expand-btn { opacity: 1; }

        /* Camera Panel — positioned between left and right panels */
        .camera-panel {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            display: none;
            max-width: 780px;
            width: calc(100% - 420px - 400px - 40px);
            min-width: 600px;
        }

        .camera-panel.active {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .camera-panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .camera-panel-header .cam-dot {
            width: 8px;
            height: 8px;
            background: var(--red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .camera-panel-header span {
            font-size: 13px;
            font-weight: 600;
            color: var(--white);
        }

        .camera-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .camera-grid::-webkit-scrollbar {
            height: 4px;
        }

        .camera-grid::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
        }

        .camera-card {
            min-width: 260px;
            max-width: 320px;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .camera-card.activated {
            border-color: var(--red);
            box-shadow: 0 0 20px rgba(239,68,68,0.3);
        }

        .camera-feed {
            width: 100%;
            height: 170px;
            background: var(--gray-900);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .camera-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-feed .no-feed {
            color: var(--gray-500);
            font-size: 13px;
            text-align: center;
        }

        .camera-feed .live-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            background: rgba(239,68,68,0.9);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
        }

        .camera-feed .live-badge .rec-dot {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .camera-info {
            padding: 10px 12px;
        }

        .camera-info .cam-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--white);
            margin-bottom: 4px;
        }

        .camera-info .cam-status {
            font-size: 11px;
            color: var(--gray-400);
        }

        .camera-info .cam-reason {
            font-size: 11px;
            color: var(--red);
            margin-top: 4px;
            font-weight: 500;
        }

        .camera-toggle-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--white);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        .camera-toggle-btn:hover {
            background: var(--glass-hover);
            border-color: rgba(255,255,255,0.18);
            transform: translateY(-1px);
        }

        .camera-toggle-btn .cam-count {
            background: var(--red);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 8px;
            min-width: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Map -->
    <div id="map"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo">
            <img src="/logo.png" alt="Mayday" style="width:40px;height:40px;border-radius:11px;">
            <span class="logo-text">Mayday</span>
            <span class="logo-sub">Dispatch Intelligence</span>
        </div>

        <div class="top-center">
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Monitoring</span>
            </div>
        </div>

        <div class="top-actions">
            <button class="camera-toggle-btn" id="cameraToggleBtn" onclick="toggleCameraPanel()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Cameras
                <span class="cam-count" id="camCount" style="display:none;">0</span>
            </button>
            <button class="btn simulate" id="simulateBtn" onclick="toggleSimulation()">
                <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <span id="simulateBtnText">Simulate</span>
            </button>
            <button class="btn danger" onclick="clearAll()">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
                Clear
            </button>
        </div>
    </div>

    <!-- Left Panel Toggle -->
    <button class="toggle-btn toggle-left" id="toggleLeft" onclick="toggleLeftPanel()">&#9664;</button>

    <!-- Left Panel: Command Center -->
    <div class="left-panel" id="leftPanel">
        <div class="panel-header">
            <div class="panel-title">
                Command Center
                <span class="count-badge" id="securityCountBadge">0</span>
            </div>
            <button class="panel-close" onclick="toggleLeftPanel()">&times;</button>
        </div>
        <div class="left-panel-scroll" id="leftPanelContent">
            <div class="empty-state">
                <div class="empty-state-icon" style="font-size:28px;opacity:0.5;">--</div>
                <div class="empty-state-text">No active personnel</div>
                <div class="empty-state-sub">Security data will appear here</div>
            </div>
        </div>
    </div>

    <!-- Right Panel Toggle -->
    <button class="toggle-btn toggle-right" id="toggleRight" onclick="toggleRightPanel()">&#9654;</button>

    <!-- Right Panel: Live Feed -->
    <div class="right-panel" id="rightPanel">
        <div class="panel-header">
            <div class="panel-title">
                Live Feed
                <span class="count-badge" id="feedCountBadge">0</span>
            </div>
            <button class="panel-close" onclick="toggleRightPanel()">&times;</button>
        </div>
        <div class="panel-content" id="feedContent">
            <div class="empty-state">
                <div class="empty-state-icon" style="font-size:28px;opacity:0.5;">--</div>
                <div class="empty-state-text">Awaiting transmissions</div>
                <div class="empty-state-sub">Messages will stream here in real-time</div>
            </div>
        </div>
    </div>

    <!-- Camera Panel -->
    <div class="camera-panel" id="cameraPanel">
        <div class="camera-panel-header" onclick="toggleCameraPanel()">
            <div class="cam-dot"></div>
            <span id="cameraPanelTitle">Cameras — 0 activated</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto;"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
        <div class="camera-grid" id="cameraGrid"></div>
    </div>

    <!-- Bottom Stats Bar -->
    <div class="stats-bar" id="statsBar">
        <div class="stat-item" data-filter="panic" onclick="toggleFilter('panic')">
            <div class="stat-icon" style="color: var(--red);">
                <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </div>
            <div class="stat-content">
                <div class="stat-value" id="statPanic">0</div>
                <div class="stat-label">Panics</div>
            </div>
        </div>
        <div class="stat-item" data-filter="incident-report" onclick="toggleFilter('incident-report')">
            <div class="stat-icon" style="color: var(--orange);">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            </div>
            <div class="stat-content">
                <div class="stat-value" id="statIncident">0</div>
                <div class="stat-label">Incidents</div>
            </div>
        </div>
        <div class="stat-item" data-filter="security" onclick="toggleFilter('security')">
            <div class="stat-icon" style="color: var(--blue);"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></div>
            <div class="stat-content">
                <div class="stat-value" id="statSecurity">0</div>
                <div class="stat-label">Security</div>
            </div>
        </div>
        <div class="stat-item" data-filter="witness-confirm" onclick="toggleFilter('witness-confirm')">
            <div class="stat-icon" style="color: var(--green);">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="stat-content">
                <div class="stat-value" id="statWitness">0</div>
                <div class="stat-label">Witnesses</div>
            </div>
        </div>
        <div class="stat-item" data-filter="all" onclick="toggleFilter('all')">
            <div class="stat-icon" style="color: var(--white);">
                <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 7V5a4 4 0 00-8 0v2"></path></svg>
            </div>
            <div class="stat-content">
                <div class="stat-value" id="statDevices">0</div>
                <div class="stat-label">Devices</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- socket.io removed, using raw WebSocket for WebRTC signaling -->
    <script>
        // ==================== STATE ====================
        var map;
        var markerLayers = {};
        var activeFilter = null;
        var simulating = false;
        var simInterval = null;
        var simPhase = 0;
        var lastMessageIds = new Set();
        var rightPanelOpen = true;
        var leftPanelOpen = true;
        // Track generated panic IDs for simulation witness/response linking
        var simPanicIds = [];

        // Philadelphia landmarks for simulation
        var PHILLY_LOCATIONS = [
            { name: 'UPenn Campus', lat: 39.9522, lng: -75.1932 },
            { name: 'Temple University', lat: 39.9812, lng: -75.1486 },
            { name: 'Drexel University', lat: 39.9566, lng: -75.1899 },
            { name: '30th Street Station', lat: 39.9557, lng: -75.1821 },
            { name: 'City Hall', lat: 39.9524, lng: -75.1636 },
            { name: 'Rittenhouse Square', lat: 39.9496, lng: -75.1718 },
            { name: 'Reading Terminal', lat: 39.9533, lng: -75.1590 },
            { name: 'SEPTA Suburban Station', lat: 39.9538, lng: -75.1678 },
            { name: 'Jefferson Station', lat: 39.9523, lng: -75.1581 },
            { name: 'Broad Street Line', lat: 39.9450, lng: -75.1636 },
            { name: 'Penn Museum', lat: 39.9491, lng: -75.1912 },
            { name: 'Franklin Field', lat: 39.9502, lng: -75.1903 },
            { name: 'The Quad', lat: 39.9517, lng: -75.1974 },
            { name: 'Wharton School', lat: 39.9531, lng: -75.1983 },
            { name: 'SEPTA 40th St', lat: 39.9562, lng: -75.2013 },
            { name: 'Philadelphia Museum of Art', lat: 39.9656, lng: -75.1810 },
            { name: 'LOVE Park', lat: 39.9543, lng: -75.1658 },
            { name: 'Independence Hall', lat: 39.9489, lng: -75.1500 }
        ];

        var EMERGENCY_TYPES = ['assault', 'medical', 'fire', 'suspicious_activity', 'theft', 'harassment', 'active_threat', 'accident'];
        var GUARD_NAMES = ['Officer Chen', 'Officer Martinez', 'Officer Williams', 'Sgt. Patel', 'Officer Kim', 'Officer Thompson', 'Sgt. Davis', 'Officer Robinson'];
        var CIVILIAN_NAMES = ['Alex M.', 'Jordan T.', 'Sam K.', 'Riley P.', 'Casey B.', 'Morgan L.', 'Drew S.', 'Quinn R.', 'Blake H.', 'Avery N.'];

        // ==================== MAP INIT ====================
        function initMap() {
            map = L.map('map', {
                center: [39.9526, -75.1635],
                zoom: 14,
                zoomControl: true,
                attributionControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            markerLayers = {
                panic: L.layerGroup().addTo(map),
                'incident-report': L.layerGroup().addTo(map),
                'witness-confirm': L.layerGroup().addTo(map),
                'security-response': L.layerGroup().addTo(map),
                'security-status': L.layerGroup().addTo(map),
                security: L.layerGroup().addTo(map),
                sos: L.layerGroup().addTo(map),
                triage: L.layerGroup().addTo(map),
                shelter: L.layerGroup().addTo(map),
                'missing-person': L.layerGroup().addTo(map),
                broadcast: L.layerGroup().addTo(map),
                lines: L.layerGroup().addTo(map),
                zones: L.layerGroup().addTo(map)
            };
        }

        // ==================== MARKER CREATION ====================
        function createPanicMarker(msg) {
            var severity = msg.severityScore || (msg.data && msg.data.severityScore) || 5;
            var witnessCount = (msg.data && msg.data.witnessCount) || 0;

            var witnessBadge = '';
            if (witnessCount > 0) {
                witnessBadge = '<div class="panic-witness-badge">' + witnessCount + '</div>';
            }
            var markerHtml = '<div class="panic-marker">' +
                '<div class="panic-marker-inner">' + severity + '</div>' +
                '<div class="panic-marker-ring"></div>' +
                witnessBadge +
                '</div>';

            var icon = L.divIcon({
                html: markerHtml,
                className: '',
                iconSize: [46, 46],
                iconAnchor: [23, 23]
            });

            return L.marker([msg.latitude, msg.longitude], { icon: icon }).bindPopup(createPopup(msg));
        }

        function createIncidentMarker(msg) {
            var icon = L.divIcon({
                html: '<div class="incident-marker" style="font-size:14px;font-weight:700;">!</div>',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            return L.marker([msg.latitude, msg.longitude], { icon: icon }).bindPopup(createPopup(msg));
        }

        function createSecurityMarker(guard) {
            var firstName = (guard.name || 'Guard').split(' ').pop();
            var markerHtml = '<div class="security-marker">' +
                '<div class="shield-shape">' +
                '<svg viewBox="0 0 34 38" fill="none">' +
                '<path d="M17 2 L32 8 L32 20 C32 28 25 34 17 37 C9 34 2 28 2 20 L2 8 Z" fill="#2563eb" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>' +
                '<text x="17" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold">S</text>' +
                '</svg>' +
                '</div>' +
                '<div class="shield-label">' + firstName + '</div>' +
                '</div>';

            var icon = L.divIcon({
                html: markerHtml,
                className: '',
                iconSize: [34, 52],
                iconAnchor: [17, 38]
            });
            var lat = guard.latitude || guard.lat;
            var lng = guard.longitude || guard.lng;
            if (!lat || !lng) return null;
            return L.marker([lat, lng], { icon: icon }).bindPopup(createSecurityPopup(guard));
        }

        function createWitnessMarker(msg) {
            var icon = L.divIcon({
                html: '<div class="witness-marker">&#x2713;</div>',
                className: '',
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });
            return L.marker([msg.latitude, msg.longitude], { icon: icon }).bindPopup(createPopup(msg));
        }

        function createSOSMarker(msg) {
            var icon = L.divIcon({
                html: '<div class="sos-marker"><span class="sos-marker-label">!</span></div>',
                className: '',
                iconSize: [32, 28],
                iconAnchor: [16, 28]
            });
            return L.marker([msg.latitude, msg.longitude], { icon: icon }).bindPopup(createPopup(msg));
        }

        function createTriageMarker(msg) {
            var icon = L.divIcon({
                html: '<div class="triage-marker"><span>+</span></div>',
                className: '',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
            return L.marker([msg.latitude, msg.longitude], { icon: icon }).bindPopup(createPopup(msg));
        }

        function createShelterMarker(msg) {
            var icon = L.divIcon({
                html: '<div class="shelter-marker" style="font-size:12px;font-weight:700;">H</div>',
                className: '',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
            return L.marker([msg.latitude, msg.longitude], { icon: icon }).bindPopup(createPopup(msg));
        }

        function createMissingMarker(msg) {
            var icon = L.divIcon({
                html: '<div class="missing-marker" style="font-size:12px;font-weight:700;">?</div>',
                className: '',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
            return L.marker([msg.latitude, msg.longitude], { icon: icon }).bindPopup(createPopup(msg));
        }

        function createBroadcastMarker(msg) {
            var icon = L.divIcon({
                html: '<div class="broadcast-marker" style="font-size:12px;font-weight:700;">B</div>',
                className: '',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
            return L.marker([msg.latitude, msg.longitude], { icon: icon }).bindPopup(createPopup(msg));
        }

        // ==================== POPUPS ====================
        function formatTime(ts) {
            if (!ts) return '';
            var d = new Date(ts);
            var now = new Date();
            var diff = (now - d) / 1000;
            if (diff < 60) return Math.floor(diff) + 's ago';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return d.toLocaleDateString();
        }

        function formatType(type) {
            return (type || '').replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
        }

        function escapeHtml(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        function createPopup(msg) {
            var severity = msg.severityScore || (msg.data && msg.data.severityScore);
            var details = '';
            var data = msg.data || {};

            if (data.emergencyType || msg.emergencyType) {
                details += '<div class="popup-detail-row"><span class="popup-detail-label">Emergency</span><br>' + escapeHtml(formatType(data.emergencyType || msg.emergencyType)) + '</div>';
            }
            if (data.description) {
                details += '<div class="popup-detail-row"><span class="popup-detail-label">Description</span><br>' + escapeHtml(data.description) + '</div>';
            }
            if (data.category) {
                details += '<div class="popup-detail-row"><span class="popup-detail-label">Category</span><br>' + escapeHtml(data.category) + '</div>';
            }
            if (data.missingPersonName) {
                details += '<div class="popup-detail-row"><span class="popup-detail-label">Missing Person</span><br>' + escapeHtml(data.missingPersonName) + '</div>';
            }
            if (data.shelterName) {
                details += '<div class="popup-detail-row"><span class="popup-detail-label">Shelter</span><br>' + escapeHtml(data.shelterName) + '</div>';
            }
            if (data.capacity) {
                details += '<div class="popup-detail-row"><span class="popup-detail-label">Capacity</span><br>' + escapeHtml(String(data.capacity)) + '</div>';
            }
            if (data.message || data.broadcastMessage) {
                details += '<div class="popup-detail-row"><span class="popup-detail-label">Message</span><br>' + escapeHtml(data.message || data.broadcastMessage) + '</div>';
            }
            if (msg.estimatedArrival || data.estimatedArrival) {
                details += '<div class="popup-detail-row"><span class="popup-detail-label">ETA</span><br>' + escapeHtml(msg.estimatedArrival || data.estimatedArrival) + '</div>';
            }

            var severityHtml = '';
            if (severity != null) {
                var cls = severity >= 8 ? 'severity-crit' : severity >= 6 ? 'severity-high' : severity >= 4 ? 'severity-med' : 'severity-low';
                severityHtml = ' <span class="severity-badge ' + cls + '">SEV ' + severity + '</span>';
            }

            var coordsHtml = '';
            if (msg.latitude) {
                coordsHtml = '<div class="popup-coords">' + msg.latitude.toFixed(5) + ', ' + msg.longitude.toFixed(5) + '</div>';
            }

            return '<div class="popup-inner">' +
                '<div class="popup-type-row">' +
                '<span class="popup-type-tag ' + (msg.type || '') + '">' + escapeHtml(formatType(msg.type)) + '</span>' +
                '<span class="popup-timestamp">' + formatTime(msg.timestamp) + '</span>' +
                '</div>' +
                '<div class="popup-sender">' + escapeHtml(msg.senderName || 'Unknown') + severityHtml + '</div>' +
                '<div class="popup-role">' + escapeHtml(msg.senderRole || '') + '</div>' +
                (details ? '<div class="popup-divider"></div>' + details : '') +
                coordsHtml +
                '</div>';
        }

        function createSecurityPopup(guard) {
            var statusColor = guard.dutyStatus === 'responding' ? 'var(--orange)' : guard.dutyStatus === 'on_duty' ? 'var(--blue)' : 'var(--gray-500)';
            var skillsHtml = '';
            if (guard.skills && guard.skills.length) {
                skillsHtml = '<div class="popup-divider"></div><div class="popup-detail-row"><span class="popup-detail-label">Skills</span><br>' + escapeHtml(guard.skills.join(', ')) + '</div>';
            }
            var respondingHtml = '';
            if (guard.respondingTo) {
                respondingHtml = '<div class="popup-detail-row"><span class="popup-detail-label">Responding To</span><br>' + escapeHtml(guard.respondingTo) + '</div>';
            }
            var coordsHtml = '';
            if (guard.latitude) {
                coordsHtml = '<div class="popup-coords">' + guard.latitude.toFixed(5) + ', ' + guard.longitude.toFixed(5) + '</div>';
            }

            return '<div class="popup-inner">' +
                '<div class="popup-type-row">' +
                '<span class="popup-type-tag security-response">Security</span>' +
                '<span class="popup-timestamp">' + formatTime(guard.lastSeen) + '</span>' +
                '</div>' +
                '<div class="popup-sender">' + escapeHtml(guard.name || 'Unknown') + '</div>' +
                '<div class="popup-role" style="color:' + statusColor + '">' + escapeHtml((guard.dutyStatus || 'unknown').replace('_', ' ').toUpperCase()) + '</div>' +
                skillsHtml +
                respondingHtml +
                coordsHtml +
                '</div>';
        }

        // ==================== DATA FETCHING ====================
        function fetchData() {
            Promise.all([
                fetch('/api/map-data').then(function(r) { return r.json(); }).catch(function() { return []; }),
                fetch('/api/stats' + (simulating ? '' : '?real=true')).then(function(r) { return r.json(); }).catch(function() { return {}; }),
                fetch('/api/security').then(function(r) { return r.json(); }).catch(function() { return []; }),
                fetch('/api/panics').then(function(r) { return r.json(); }).catch(function() { return []; }),
                fetch('/api/messages?limit=50').then(function(r) { return r.json(); }).catch(function() { return []; })
            ]).then(function(results) {
                var mapRes = results[0];
                var statsRes = results[1];
                var secRes = results[2];
                var panicRes = results[3];
                var msgsRes = results[4];

                // Separate real alerts from simulation data
                var realMsgs = msgsRes.filter(function(m) { return !m.simulated; });
                var realMapData = mapRes.filter(function(m) { return !m.simulated; });

                // Left panel always shows only real alerts
                updateLeftPanel(secRes, panicRes.filter(function(p) { return !p.simulated; }));

                // Feed and map show sim data only when simulating
                // Don't overwrite the feed if we're viewing an incident detail
                if (simulating) {
                    updateStats(statsRes);
                    updateMap(mapRes, secRes, panicRes);
                    if (!activeIncidentId) updateFeed(msgsRes);
                    updateStatusBadge(statsRes, panicRes);
                } else {
                    updateStats(statsRes);
                    updateMap(realMapData, secRes, panicRes.filter(function(p) { return !p.simulated; }));
                    if (!activeIncidentId) updateFeed(realMsgs);
                    updateStatusBadge(statsRes, panicRes.filter(function(p) { return !p.simulated; }));
                }
            }).catch(function(e) {
                console.error('Fetch error:', e);
            });
        }

        // ==================== UPDATE STATS ====================
        function updateStats(stats) {
            animateValue('statPanic', stats.panicAlerts || 0);
            animateValue('statIncident', stats.incidentReports || 0);
            animateValue('statSecurity', stats.securityOnDuty || 0);
            animateValue('statWitness', stats.witnessConfirmations || 0);
            animateValue('statDevices', stats.connectedDevices || 0);
        }

        function animateValue(id, newVal) {
            var el = document.getElementById(id);
            if (!el) return;
            var current = parseInt(el.textContent) || 0;
            if (current !== newVal) {
                el.textContent = newVal;
                el.style.transform = 'scale(1.2)';
                setTimeout(function() { el.style.transform = 'scale(1)'; el.style.transition = 'transform 0.2s'; }, 50);
            }
        }

        // ==================== UPDATE MAP ====================
        function updateMap(mapData, security, panics) {
            Object.keys(markerLayers).forEach(function(key) {
                markerLayers[key].clearLayers();
            });

            // Build panic locations index for response lines
            var panicLocations = {};
            panics.forEach(function(p) {
                if (p.latitude && p.longitude) {
                    panicLocations[p.id] = { lat: p.latitude, lng: p.longitude };
                }
            });
            mapData.filter(function(m) { return m.type === 'panic'; }).forEach(function(m) {
                if (m.latitude && m.longitude && m.panicId) {
                    panicLocations[m.panicId] = { lat: m.latitude, lng: m.longitude };
                }
            });

            // Danger zones around active panics
            panics.forEach(function(p) {
                if (p.latitude && p.longitude) {
                    var zone = L.circle([p.latitude, p.longitude], {
                        radius: 150,
                        color: '#ef4444',
                        weight: 2,
                        opacity: 0.4,
                        fillColor: '#ef4444',
                        fillOpacity: 0.06,
                        dashArray: '8, 8'
                    });
                    markerLayers.zones.addLayer(zone);
                }
            });

            // Map markers
            mapData.forEach(function(msg) {
                if (!msg.latitude || !msg.longitude) return;
                var marker;

                switch (msg.type) {
                    case 'panic':
                        marker = createPanicMarker(msg);
                        if (marker) markerLayers.panic.addLayer(marker);
                        break;
                    case 'incident-report':
                        marker = createIncidentMarker(msg);
                        if (marker) markerLayers['incident-report'].addLayer(marker);
                        break;
                    case 'witness-confirm':
                        marker = createWitnessMarker(msg);
                        if (marker) markerLayers['witness-confirm'].addLayer(marker);
                        break;
                    case 'security-response':
                        if (msg.respondingToPanicId && panicLocations[msg.respondingToPanicId]) {
                            var panicLoc = panicLocations[msg.respondingToPanicId];
                            var line = L.polyline(
                                [[msg.latitude, msg.longitude], [panicLoc.lat, panicLoc.lng]],
                                { color: '#3b82f6', weight: 2.5, opacity: 0.7, dashArray: '6, 8' }
                            );
                            markerLayers.lines.addLayer(line);
                        }
                        break;
                    case 'sos':
                        marker = createSOSMarker(msg);
                        if (marker) markerLayers.sos.addLayer(marker);
                        break;
                    case 'triage':
                        marker = createTriageMarker(msg);
                        if (marker) markerLayers.triage.addLayer(marker);
                        break;
                    case 'shelter':
                        marker = createShelterMarker(msg);
                        if (marker) markerLayers.shelter.addLayer(marker);
                        break;
                    case 'missing-person':
                        marker = createMissingMarker(msg);
                        if (marker) markerLayers['missing-person'].addLayer(marker);
                        break;
                    case 'broadcast':
                        marker = createBroadcastMarker(msg);
                        if (marker) markerLayers.broadcast.addLayer(marker);
                        break;
                }
            });

            // Security markers + response lines from guards
            security.forEach(function(guard) {
                var m = createSecurityMarker(guard);
                if (m) {
                    markerLayers.security.addLayer(m);

                    if (guard.respondingTo && panicLocations[guard.respondingTo]) {
                        var pLoc = panicLocations[guard.respondingTo];
                        var lat = guard.latitude || guard.lat;
                        var lng = guard.longitude || guard.lng;
                        if (lat && lng) {
                            var rLine = L.polyline(
                                [[lat, lng], [pLoc.lat, pLoc.lng]],
                                { color: '#3b82f6', weight: 3, opacity: 0.8, dashArray: '8, 10' }
                            );
                            markerLayers.lines.addLayer(rLine);
                        }
                    }
                }
            });

            applyFilter();
        }

        // ==================== UPDATE FEED ====================
        function updateFeed(messages) {
            var container = document.getElementById('feedContent');
            var badge = document.getElementById('feedCountBadge');
            badge.textContent = messages.length;

            if (messages.length === 0) {
                while (container.firstChild) container.removeChild(container.firstChild);
                var emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-state';
                var iconDiv = document.createElement('div');
                iconDiv.className = 'empty-state-icon';
                iconDiv.textContent = '--';
                var textDiv = document.createElement('div');
                textDiv.className = 'empty-state-text';
                textDiv.textContent = 'Awaiting transmissions';
                var subDiv = document.createElement('div');
                subDiv.className = 'empty-state-sub';
                subDiv.textContent = 'Messages will stream here in real-time';
                emptyDiv.appendChild(iconDiv);
                emptyDiv.appendChild(textDiv);
                emptyDiv.appendChild(subDiv);
                container.appendChild(emptyDiv);
                return;
            }

            var currentIds = new Set(messages.map(function(m) { return m.id; }));

            var typeLabels = {
                'panic': 'PANIC',
                'incident-report': 'INCIDENT',
                'witness-confirm': 'WITNESS',
                'security-response': 'RESPONSE',
                'security-status': 'SECURITY',
                'sos': 'SOS',
                'triage': 'TRIAGE',
                'shelter': 'SHELTER',
                'missing-person': 'MISSING',
                'broadcast': 'BROADCAST'
            };

            // Build feed using DOM methods
            var frag = document.createDocumentFragment();

            messages.forEach(function(msg, idx) {
                var isNew = !lastMessageIds.has(msg.id);
                var icon = typeLabels[msg.type] || msg.type;
                var severity = msg.data && msg.data.severityScore;
                var isSecurity = msg.senderRole === 'security' || msg.senderRole === 'admin';
                var data = msg.data || {};

                var card = document.createElement('div');
                card.className = 'msg-card';
                if (isNew) card.style.animationDelay = (idx * 30) + 'ms';

                var msgLat = data.latitude || 0;
                var msgLng = data.longitude || 0;
                card.addEventListener('click', (function(lat, lng) {
                    return function() { flyToMessage(lat, lng); };
                })(msgLat, msgLng));

                // Top row
                var topRow = document.createElement('div');
                topRow.className = 'msg-card-top';

                var typeBadge = document.createElement('span');
                typeBadge.className = 'msg-type-badge ' + (msg.type || '');
                typeBadge.textContent = icon;
                topRow.appendChild(typeBadge);

                var timeSpan = document.createElement('span');
                timeSpan.className = 'msg-time';
                timeSpan.textContent = formatTime(msg.timestamp);
                topRow.appendChild(timeSpan);

                card.appendChild(topRow);

                // Sender row
                var senderDiv = document.createElement('div');
                senderDiv.className = 'msg-sender';

                if (isSecurity) {
                    var shieldSpan = document.createElement('span');
                    shieldSpan.className = 'security-shield';
                    shieldSpan.textContent = 'S';
                    senderDiv.appendChild(shieldSpan);
                }

                var nameText = document.createTextNode(msg.senderName || 'Unknown');
                senderDiv.appendChild(nameText);

        // ==================== UPDATE LEFT PANEL ====================

                var subDiv = document.createElement('div');

                    var avatarClass = status === 'responding' ? 'responding' : status === 'on_duty' ? 'on-duty' : 'off-duty';

                    var card = document.createElement('div');
                    card.className = 'guard-card';
                    var gLat = guard.latitude || 0;

                    nameDiv.textContent = guard.name || 'Unknown';
                    info.appendChild(nameDiv);

                    var statusDiv = document.createElement('div');
                    statusDiv.className = 'guard-status ' + statusClass;
