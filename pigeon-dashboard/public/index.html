        // ==================== INCIDENT DETAIL VIEW ====================
        var activeIncidentId = null;
        var viewedPanicIds = new Set();  // Track which panics have been opened
        var incidentRadiusCircle = null;
        var incidentRefreshInterval = null;

        function openIncidentDetail(panicId) {
            activeIncidentId = panicId;
            viewedPanicIds.add(panicId);  // Mark as viewed
            // Clear any existing refresh interval
            if (incidentRefreshInterval) clearInterval(incidentRefreshInterval);

            fetchIncidentDetail(panicId, true);

            // Auto-refresh incident detail every 3 seconds to pick up new transcripts/analysis
            incidentRefreshInterval = setInterval(function() {
                if (activeIncidentId === panicId) {
                    fetchIncidentDetail(panicId, false);
                } else {
                    clearInterval(incidentRefreshInterval);
                }
            }, 3000);
        }

        function fetchIncidentDetail(panicId, isFirstLoad) {
            fetch('/api/incident/' + panicId)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    renderIncidentDetail(data);
                    if (isFirstLoad) {
                        // Fly to incident and show 500m radius
                        if (data.panic.latitude && data.panic.longitude) {
                            map.flyTo([data.panic.latitude, data.panic.longitude], 15, { duration: 1 });
                            if (incidentRadiusCircle) map.removeLayer(incidentRadiusCircle);
                            incidentRadiusCircle = L.circle([data.panic.latitude, data.panic.longitude], {
                                radius: 500, color: '#22c55e', weight: 2, opacity: 0.6,
                                fillColor: '#22c55e', fillOpacity: 0.06, dashArray: '10, 8'
                            }).addTo(map);
                        }
                        // Auto-activate nearby cameras and open camera panel
                        data.nearbyCameras.forEach(function(cam) {
                            if (!cam.isActivated) {
                                fetch('/api/cameras/' + cam.id + '/activate', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ panicId: panicId, reason: 'Incident within ' + cam.distance + 'm' })
                                });
                            }
                        });
                        if (data.nearbyCameras.length > 0 && !cameraPanelOpen) {
                            toggleCameraPanel();
                            fetchCameras();
                        }
                    }
                })
                .catch(function(e) { console.error('Failed to load incident:', e); });
        }

        function closeIncidentDetail() {
            activeIncidentId = null;
            if (incidentRefreshInterval) { clearInterval(incidentRefreshInterval); incidentRefreshInterval = null; }
            if (incidentRadiusCircle) {
                map.removeLayer(incidentRadiusCircle);
                incidentRadiusCircle = null;
            }
            // Restore normal right panel
            var panel = document.getElementById('rightPanel');
            var header = panel.querySelector('.panel-header .panel-title');
            header.childNodes[0].textContent = 'Live Feed ';
            var content = document.getElementById('feedContent');
            content.className = 'panel-content';
            content.id = 'feedContent';
            // Force refresh
            fetchData();
        }

        // ==================== STATUS BADGE ====================
        function updateStatusBadge(stats, panics) {
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('statusText');

            if (panics && panics.length > 0) {
                dot.className = 'status-dot alert';
                text.textContent = panics.length + ' Active Panic' + (panics.length > 1 ? 's' : '');

        // ==================== FILTERING ====================
        function toggleFilter(filterType) {
            var items = document.querySelectorAll('.stat-item');

            if (activeFilter === filterType || filterType === 'all') {
                activeFilter = null;
                items.forEach(function(i) { i.classList.remove('active'); });
            } else {
                activeFilter = filterType;
                items.forEach(function(i) {
                    if (i.dataset.filter === filterType) {
                        i.classList.add('active');
                    } else {
                        i.classList.remove('active');
                    }
                });
            }

            applyFilter();
        }

        function applyFilter() {
            if (!activeFilter) {
                Object.keys(markerLayers).forEach(function(key) {
                    if (!map.hasLayer(markerLayers[key])) {
                        map.addLayer(markerLayers[key]);
                    }
                });
                return;
            }

            Object.keys(markerLayers).forEach(function(key) {
                var layer = markerLayers[key];
                if (key === 'lines' || key === 'zones') {
                    if (!map.hasLayer(layer)) map.addLayer(layer);
                } else if (key === activeFilter || (activeFilter === 'security' && (key === 'security-response' || key === 'security-status'))) {
                    if (!map.hasLayer(layer)) map.addLayer(layer);
                } else {
                    if (map.hasLayer(layer)) map.removeLayer(layer);
                }
            });
        }

        // ==================== PANEL TOGGLES ====================

            rightPanelOpen = !rightPanelOpen;
            var panel = document.getElementById('rightPanel');
            var toggle = document.getElementById('toggleRight');
            if (rightPanelOpen) {
                panel.classList.remove('collapsed');
                toggle.classList.remove('shifted');
            } else {
                panel.classList.add('collapsed');
                toggle.classList.add('shifted');
            }
            toggle.textContent = rightPanelOpen ? '\u25B6' : '\u25C0';
        }

        function toggleLeftPanel() {
            leftPanelOpen = !leftPanelOpen;
            var panel = document.getElementById('leftPanel');
            var toggle = document.getElementById('toggleLeft');
            if (leftPanelOpen) {
                panel.classList.remove('collapsed');
                toggle.classList.remove('shifted');
            } else {
                panel.classList.add('collapsed');
                toggle.classList.add('shifted');
            }
            toggle.textContent = leftPanelOpen ? '\u25C0' : '\u25B6';
        }

        // ==================== CLEAR ALL ====================
        function clearAll() {
            fetch('/api/messages', { method: 'DELETE' }).then(function() {
                lastMessageIds.clear();
                Object.keys(markerLayers).forEach(function(key) {
                    markerLayers[key].clearLayers();
                });

                // Reset feed
                var feedContainer = document.getElementById('feedContent');
                while (feedContainer.firstChild) feedContainer.removeChild(feedContainer.firstChild);
                var emptyFeed = document.createElement('div');
                emptyFeed.className = 'empty-state';
                var fi = document.createElement('div');
                fi.className = 'empty-state-icon';
                fi.textContent = '--';
                var ft = document.createElement('div');
                ft.className = 'empty-state-text';
                ft.textContent = 'Awaiting transmissions';
                var fs = document.createElement('div');
                fs.className = 'empty-state-sub';
                fs.textContent = 'Messages will stream here in real-time';
                emptyFeed.appendChild(fi);
                emptyFeed.appendChild(ft);
                emptyFeed.appendChild(fs);
                feedContainer.appendChild(emptyFeed);

                // Reset left panel
                var leftContainer = document.getElementById('leftPanelContent');
                while (leftContainer.firstChild) leftContainer.removeChild(leftContainer.firstChild);
                var emptyLeft = document.createElement('div');
                emptyLeft.className = 'empty-state';
                var li = document.createElement('div');
                li.className = 'empty-state-icon';
                li.textContent = '--';
                var lt = document.createElement('div');
                lt.className = 'empty-state-text';
                lt.textContent = 'No active personnel';
                var ls = document.createElement('div');
                ls.className = 'empty-state-sub';
                ls.textContent = 'Security data will appear here';
                emptyLeft.appendChild(li);
                emptyLeft.appendChild(lt);
                emptyLeft.appendChild(ls);
                leftContainer.appendChild(emptyLeft);

                // Reset stats
                ['statPanic','statIncident','statSecurity','statWitness','statDevices'].forEach(function(id) {
                    document.getElementById(id).textContent = '0';
                });
                document.getElementById('feedCountBadge').textContent = '0';
                document.getElementById('securityCountBadge').textContent = '0';
                activeFilter = null;
                document.querySelectorAll('.stat-item').forEach(function(i) { i.classList.remove('active'); });
                simPhase = 0;
                simPanicIds = [];
            }).catch(function(e) {
                console.error('Clear failed:', e);
            });
        }

        // ==================== SIMULATION ====================
        function toggleSimulation() {
            simulating = !simulating;
            var btn = document.getElementById('simulateBtn');
            var text = document.getElementById('simulateBtnText');

            if (simulating) {
                // Clear only previous simulation data, preserve real alerts
                fetch('/api/messages/simulation', { method: 'DELETE' }).then(function() {
                    fetchData();
                    fetchCameras();
                });
                btn.classList.add('active');
                text.textContent = 'Stop';
                simPhase = 0;
                simPanicIds = [];
                runSimStep();
                simInterval = setInterval(runSimStep, 2200);
            } else {
                // Clear only simulation data, preserve real alerts
                fetch('/api/messages/simulation', { method: 'DELETE' }).then(function() {
                    fetchData();
                    fetchCameras();
                });
                btn.classList.remove('active');
                text.textContent = 'Simulate';
                clearInterval(simInterval);
                simInterval = null;
            }
        }

        function uuid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function jitter(val, range) { return val + (Math.random() - 0.5) * range; }

        function runSimStep() {
            if (!simulating) return;

            var loc = randomFrom(PHILLY_LOCATIONS);
            var messages = [];
            var deviceId = uuid();
            var deviceName, deviceRole, dutyStatus;

            simPhase++;

            if (simPhase <= 2) {
                // Security come on duty
                var guardName = GUARD_NAMES[(simPhase - 1) % GUARD_NAMES.length];
                deviceName = guardName;
                deviceRole = 'security';
                dutyStatus = 'on_duty';
                messages.push({
                    id: uuid(),
                    type: 'security-status',
                    senderId: deviceId,
                    senderName: guardName,
                    senderRole: 'security',
                    timestamp: new Date().toISOString(),
                    data: {
                        isOnDuty: true,
                        latitude: jitter(loc.lat, 0.004),
                        longitude: jitter(loc.lng, 0.004),
                        skills: ['first_aid', 'de_escalation']
                    }
                });
            } else if (simPhase === 3 || simPhase === 7 || simPhase === 12) {
                // Panic event
                var civilian = randomFrom(CIVILIAN_NAMES);
                var panicId = uuid();
                simPanicIds.push(panicId);
                var emergencyType = randomFrom(EMERGENCY_TYPES);
                var severity = Math.floor(Math.random() * 5) + 5;
                deviceName = civilian;
                deviceRole = 'civilian';
                dutyStatus = 'off_duty';
                messages.push({
                    id: uuid(),
                    type: 'panic',
                    senderId: deviceId,
                    senderName: civilian,
                    senderRole: 'civilian',
                    timestamp: new Date().toISOString(),
                    data: {
                        panicId: panicId,
                        emergencyType: emergencyType,
                        severityScore: severity,
                        latitude: jitter(loc.lat, 0.002),
                        longitude: jitter(loc.lng, 0.002),
                        description: formatType(emergencyType) + ' reported near ' + loc.name,
                        witnessCount: 0
                    }
                });
            } else if (simPhase === 4 || simPhase === 8) {
                // Witness confirmation
                var civilian = randomFrom(CIVILIAN_NAMES);
                var targetPanic = simPanicIds.length > 0 ? simPanicIds[simPanicIds.length - 1] : uuid();
                deviceName = civilian;
                deviceRole = 'civilian';
                dutyStatus = 'off_duty';
                messages.push({
                    id: uuid(),
                    type: 'witness-confirm',
                    senderId: deviceId,
                    senderName: civilian,
                    senderRole: 'civilian',
                    timestamp: new Date().toISOString(),
                    data: {
                        confirmedPanicId: targetPanic,
                        latitude: jitter(loc.lat, 0.003),
                        longitude: jitter(loc.lng, 0.003),
                        description: 'Can confirm, I saw it happen'
                    }
                });
            } else if (simPhase === 5 || simPhase === 9) {
                // Security response
                var guardName = randomFrom(GUARD_NAMES);
                var targetPanic = simPanicIds.length > 0 ? simPanicIds[simPanicIds.length - 1] : uuid();
                deviceName = guardName;
                deviceRole = 'security';
                dutyStatus = 'responding';
                messages.push({
                    id: uuid(),
                    type: 'security-response',
                    senderId: deviceId,
                    senderName: guardName,
                    senderRole: 'security',
                    timestamp: new Date().toISOString(),
                    data: {
                        respondingToPanicId: targetPanic,
                        latitude: jitter(loc.lat, 0.005),
                        longitude: jitter(loc.lng, 0.005),
                        estimatedArrival: (Math.floor(Math.random() * 5) + 2) + ' minutes'
                    }
                });
            } else if (simPhase === 6) {
                // Incident report
                var civilian = randomFrom(CIVILIAN_NAMES);
                deviceName = civilian;
                deviceRole = 'civilian';
                dutyStatus = 'off_duty';
                messages.push({
                    id: uuid(),
                    type: 'incident-report',
                    senderId: deviceId,
                    senderName: civilian,
                    senderRole: 'civilian',
                    timestamp: new Date().toISOString(),
                    data: {
                        category: randomFrom(['theft', 'vandalism', 'suspicious_person', 'noise_disturbance']),
                        description: 'Incident reported at ' + loc.name,
                        latitude: jitter(loc.lat, 0.003),
                        longitude: jitter(loc.lng, 0.003),
                        severityScore: Math.floor(Math.random() * 4) + 2
                    }
                });
            } else if (simPhase === 10) {
                // SOS
                var civilian = randomFrom(CIVILIAN_NAMES);
                deviceName = civilian;
                deviceRole = 'civilian';
                dutyStatus = 'off_duty';
                messages.push({
                    id: uuid(),
                    type: 'sos',
                    senderId: deviceId,
                    senderName: civilian,
                    senderRole: 'civilian',
                    timestamp: new Date().toISOString(),
                    data: {
                        message: 'Need immediate help',
                        latitude: jitter(loc.lat, 0.003),
                        longitude: jitter(loc.lng, 0.003),
                        batteryLevel: Math.floor(Math.random() * 30) + 5
                    }
                });
            } else if (simPhase === 11) {
                // Triage report
                var guardName = randomFrom(GUARD_NAMES);
                deviceName = guardName;
                deviceRole = 'security';
                dutyStatus = 'on_duty';
                messages.push({
                    id: uuid(),
                    type: 'triage',
                    senderId: deviceId,
                    senderName: guardName,
                    senderRole: 'security',
                    timestamp: new Date().toISOString(),
                    data: {
                        category: 'medical',
                        injuryCount: Math.floor(Math.random() * 3) + 1,
                        description: 'Medical triage at ' + loc.name,
                        latitude: jitter(loc.lat, 0.002),
                        longitude: jitter(loc.lng, 0.002),
                        severityScore: Math.floor(Math.random() * 4) + 4
                    }
                });
            } else if (simPhase === 13) {
                // Shelter update
                var guardName = randomFrom(GUARD_NAMES);
                deviceName = guardName;
                deviceRole = 'security';
                dutyStatus = 'on_duty';
                messages.push({
                    id: uuid(),
                    type: 'shelter',
                    senderId: deviceId,
                    senderName: guardName,
                    senderRole: 'security',
                    timestamp: new Date().toISOString(),
                    data: {
                        shelterName: loc.name + ' Safe Zone',
                        capacity: Math.floor(Math.random() * 50) + 20,
                        isOpen: true,
                        latitude: jitter(loc.lat, 0.001),
                        longitude: jitter(loc.lng, 0.001)
                    }
                });
            } else if (simPhase === 14) {
                // Missing person
                var civilian = randomFrom(CIVILIAN_NAMES);
                deviceName = civilian;
                deviceRole = 'civilian';
                dutyStatus = 'off_duty';
                messages.push({
                    id: uuid(),
                    type: 'missing-person',
                    senderId: deviceId,
                    senderName: civilian,
                    senderRole: 'civilian',
                    timestamp: new Date().toISOString(),
                    data: {
                        missingPersonName: randomFrom(['Emily W.', 'David C.', 'Sarah L.', 'James H.']),
                        lastSeenLocation: loc.name,
                        description: 'Last seen 30 minutes ago',
                        latitude: jitter(loc.lat, 0.002),
                        longitude: jitter(loc.lng, 0.002)
                    }
                });
            } else if (simPhase === 15) {
                // Broadcast
                var guardName = randomFrom(GUARD_NAMES);
                deviceName = guardName;
                deviceRole = 'security';
                dutyStatus = 'on_duty';
                messages.push({
                    id: uuid(),
                    type: 'broadcast',
                    senderId: deviceId,
                    senderName: guardName,
                    senderRole: 'security',
                    timestamp: new Date().toISOString(),
                    data: {
                        broadcastMessage: 'All clear near ' + loc.name + '. Resume normal activity.',
                        latitude: jitter(loc.lat, 0.002),
                        longitude: jitter(loc.lng, 0.002),
                        priority: 'normal'
                    }
                });
            } else {
                // Cycle back
                simPhase = 2;
                return;
            }

            if (messages.length > 0) {
                // Tag every simulation message so it can be filtered from real alerts
                messages.forEach(function(m) { m.simulated = true; });
                fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        deviceId: deviceId,
                        deviceName: deviceName || 'Sim Device',
                        deviceRole: deviceRole || 'civilian',
                        dutyStatus: dutyStatus || 'off_duty',
                        timestamp: new Date().toISOString(),
                        messages: messages
                    })
                }).catch(function(e) {
                    console.error('Simulation post failed:', e);
                });
            }
        }

        // ==================== CAMERA SYSTEM ====================

        var cameraPanelOpen = false;
        var cameraData = [];

        function toggleCameraPanel() {
            cameraPanelOpen = !cameraPanelOpen;
            var panel = document.getElementById('cameraPanel');
            if (cameraPanelOpen) {
                panel.classList.add('active');
            } else {
                panel.classList.remove('active');
            }
        }

        function fetchCameras() {
            fetch('/api/cameras')
                .then(function(r) { return r.json(); })
                .then(function(cameras) {
                    cameraData = cameras;
                    renderCameras(cameras);
                })
                .catch(function() {});
        }

        var renderedCameraState = ''; // Track last rendered state to avoid re-rendering

        function renderCameras(cameras) {
            var grid = document.getElementById('cameraGrid');
            var activatedCount = cameras.filter(function(c) { return c.isActivated; }).length;

            // Update count badge
            var countEl = document.getElementById('camCount');
            var liveOrActive = cameras.filter(function(c) { return c.isLive || c.isActivated; }).length;
            countEl.textContent = liveOrActive;
            countEl.style.display = liveOrActive > 0 ? 'inline-block' : 'none';

            // Don't rebuild the DOM if camera state hasn't changed — this kills active WebRTC streams
            var stateKey = cameras.map(function(c) { return c.id + ':' + c.isLive + ':' + c.isActivated; }).join(',');
            if (stateKey === renderedCameraState) return;
            renderedCameraState = stateKey;

            // Update panel title
            var titleEl = document.getElementById('cameraPanelTitle');
            titleEl.textContent = 'Cameras — ' + activatedCount + ' activated';

            // Auto-open panel when any camera is live or activated
            var liveCount = cameras.filter(function(c) { return c.isLive; }).length;
            if ((activatedCount > 0 || liveCount > 0) && !cameraPanelOpen) {
                toggleCameraPanel();
            }

            // Build camera cards
            var fragment = document.createDocumentFragment();

            cameras.forEach(function(cam) {
                var card = document.createElement('div');
                card.className = 'camera-card' + (cam.isActivated ? ' activated' : '');

                var feed = document.createElement('div');
                feed.className = 'camera-feed';

                if (cam.isLive) {
                    // LIVE badge
                    var badge = document.createElement('div');
                    badge.className = 'live-badge';
                    var dot = document.createElement('div');
                    dot.className = 'rec-dot';
                    badge.appendChild(dot);
                    badge.appendChild(document.createTextNode(' LIVE'));
                    feed.appendChild(badge);

                    // WebRTC video element
                    var vid = document.createElement('video');
                    vid.id = 'camvid-' + cam.id;
                    vid.autoplay = true;
                    vid.playsinline = true;
                    vid.muted = true;
                    vid.style.width = '100%';
                    vid.style.height = '100%';
                    vid.style.objectFit = 'cover';
                    feed.appendChild(vid);

                    // Expand button
                    var expandBtn = document.createElement('button');
                    expandBtn.className = 'camera-expand-btn';
                    expandBtn.setAttribute('data-lucide', 'maximize-2');
                    expandBtn.addEventListener('click', (function(camId, camName) {
                        return function(e) { e.stopPropagation(); expandCamera(camId, camName); };
                    })(cam.id, cam.name));
                    feed.appendChild(expandBtn);

                    connectCameraViewer(cam.id);
                } else if (cam.isActivated) {
                    var waiting = document.createElement('div');
                    waiting.className = 'no-feed';
                    var wIcon = document.createElement('i');
                    wIcon.setAttribute('data-lucide', 'video');
                    wIcon.style.cssText = 'width:28px;height:28px;margin-bottom:8px;color:var(--gray-500);';
                    waiting.appendChild(wIcon);
                    waiting.appendChild(document.createElement('br'));
                    waiting.appendChild(document.createTextNode('Waiting for camera...'));
                    var wSub = document.createElement('span');
                    wSub.style.cssText = 'font-size:10px;color:var(--gray-600);display:block;margin-top:4px;';
                    wSub.textContent = 'Open /camera.html on phone';
                    waiting.appendChild(wSub);
                    feed.appendChild(waiting);
                } else {
                    var offFeed = document.createElement('div');
                    offFeed.className = 'no-feed';
                    var oIcon = document.createElement('i');
                    oIcon.setAttribute('data-lucide', 'video-off');
                    oIcon.style.cssText = 'width:28px;height:28px;margin-bottom:8px;color:var(--gray-600);';
                    offFeed.appendChild(oIcon);
                    offFeed.appendChild(document.createElement('br'));
                    offFeed.appendChild(document.createTextNode('Camera offline'));
                    feed.appendChild(offFeed);
                }

                card.appendChild(feed);

                var info = document.createElement('div');
                info.className = 'camera-info';

                var name = document.createElement('div');
                name.className = 'cam-name';
                name.textContent = cam.name;
                info.appendChild(name);

                var status = document.createElement('div');
                status.className = 'cam-status';
                status.textContent = cam.type.charAt(0).toUpperCase() + cam.type.slice(1) + ' • ' + cam.status;
                info.appendChild(status);

                if (cam.activation && cam.activation.reason) {
                    var reason = document.createElement('div');
                    reason.className = 'cam-reason';
                    reason.textContent = cam.activation.reason;
                    info.appendChild(reason);
                }

                card.appendChild(info);
                fragment.appendChild(card);
            });

            grid.innerHTML = '';
            grid.appendChild(fragment);

            // Re-attach existing WebRTC streams to newly created video elements
            cameras.forEach(function(cam) {
                if (cam.isLive && activeViewers[cam.id] && activeViewers[cam.id].pc) {
                    var vid = document.getElementById('camvid-' + cam.id);
                    if (vid) {
                        var pc = activeViewers[cam.id].pc;
                        var receivers = pc.getReceivers();
                        var tracks = receivers.map(function(r) { return r.track; }).filter(Boolean);
                        if (tracks.length > 0) {
                            vid.srcObject = new MediaStream(tracks);
                        }
                    }
                }
            });
        }

        // ==================== WEBRTC CAMERA VIEWER ====================

        var activeViewers = {}; // camId -> { ws, pc }

        function connectCameraViewer(camId) {
            // Don't double-connect if we already have an active connection
            if (activeViewers[camId] && activeViewers[camId].pc && activeViewers[camId].pc.connectionState !== 'closed') return;

            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            var ws = new WebSocket(proto + '//' + location.host);

            ws.onopen = function() {
                ws.send(JSON.stringify({ type: 'join', room: camId, role: 'viewer' }));
                console.log('Viewer joined room: ' + camId);
            };

            ws.onmessage = function(evt) {
                var msg = JSON.parse(evt.data);

                if (msg.type === 'ready') {
                    console.log('Room ready: ' + camId);
                }

                if (msg.type === 'offer') {
                    var pc = new RTCPeerConnection({
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    });
                    activeViewers[camId] = { ws: ws, pc: pc };

                    pc.ontrack = function(e) {
                        var vid = document.getElementById('camvid-' + camId);
                        if (vid && e.streams[0]) {
                            vid.srcObject = e.streams[0];
                            console.log('Stream received for ' + camId);
                        }
                    };

                    pc.onicecandidate = function(e) {
                        if (e.candidate) {
                            ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
                        }
                    };

                    pc.setRemoteDescription(new RTCSessionDescription(msg)).then(function() {
                        return pc.createAnswer();
                    }).then(function(answer) {
                        return pc.setLocalDescription(answer);
                    }).then(function() {
                        ws.send(JSON.stringify(pc.localDescription));
                    });
                }

                if (msg.type === 'candidate' && activeViewers[camId] && activeViewers[camId].pc) {
                    activeViewers[camId].pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                }
            };

            ws.onclose = function() {
                delete activeViewers[camId];
            };
        }

        // ==================== CAMERA FULLSCREEN ====================
        function expandCamera(camId, camName) {
            var srcVid = document.getElementById('camvid-' + camId);
            if (!srcVid || !srcVid.srcObject) return;

            var overlay = document.createElement('div');
            overlay.className = 'camera-fullscreen-overlay';
            overlay.onclick = function() { document.body.removeChild(overlay); };

            var header = document.createElement('div');
            header.className = 'fs-header';
            var title = document.createElement('div');
            title.className = 'fs-title';
            title.textContent = camName + ' — LIVE';
            header.appendChild(title);
            var closeBtn = document.createElement('button');
            closeBtn.className = 'fs-close';
            closeBtn.textContent = '\u00D7';
            closeBtn.onclick = function() { document.body.removeChild(overlay); };
            header.appendChild(closeBtn);
            overlay.appendChild(header);

            var fullVid = document.createElement('video');
            fullVid.autoplay = true;
            fullVid.playsinline = true;
            fullVid.muted = true;
            fullVid.srcObject = srcVid.srcObject;
            fullVid.onclick = function(e) { e.stopPropagation(); };
            overlay.appendChild(fullVid);

            document.body.appendChild(overlay);
        }

        // ==================== INIT ====================
        initMap();
        fetchData();
        fetchCameras();
        setInterval(fetchData, 3000);
        setInterval(fetchCameras, 5000);

        // Initialize Lucide icons after DOM is ready, and after every camera render
        if (typeof lucide !== 'undefined') { lucide.createIcons(); }
        var _origRenderCameras = renderCameras;
        renderCameras = function(cameras) {
            _origRenderCameras(cameras);
            if (typeof lucide !== 'undefined') { lucide.createIcons(); }
        };
    </script>
