<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mayday Camera</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;color:#fff;font-family:-apple-system,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
        .header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.8);z-index:10}
        .title{font-size:16px;font-weight:700}
        .status{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
        .status.live{background:rgba(239,68,68,0.2);color:#ef4444}
        .status.wait{background:rgba(249,115,22,0.2);color:#f97316}
        .status.off{background:rgba(100,100,100,0.2);color:#999}
        .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
        .status.live .dot{animation:p 1s infinite}
        @keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
        .vc{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
        video{width:100%;height:100%;object-fit:cover}
        .badge{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:6px;padding:4px 10px;background:rgba(239,68,68,.85);border-radius:6px;font-size:11px;font-weight:700}
        .rd{width:8px;height:8px;background:#fff;border-radius:50%;animation:p 1s infinite}
        .cl{position:absolute;bottom:12px;left:12px;font-size:11px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.5);padding:4px 8px;border-radius:4px}
        .setup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px}
        .setup h2{font-size:20px}
        .setup p{font-size:14px;color:#999;text-align:center}
        .f{width:100%;max-width:300px}
        .f label{display:block;font-size:12px;font-weight:600;color:#999;text-transform:uppercase;margin-bottom:8px}
        .f select{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-size:15px}
        .btn{width:100%;max-width:300px;padding:14px;border:none;border-radius:12px;background:#ef4444;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
        .btn:disabled{background:#333;color:#666}
        .err{color:#ef4444;font-size:13px;text-align:center}
        .hidden{display:none}
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Mayday Camera</div>
        <div class="status off" id="st"><div class="dot"></div><span id="stTxt">Ready</span></div>
    </div>

    <div class="setup" id="setup">
        <div style="font-size:48px">📹</div>
        <h2>Camera Node</h2>
        <p>Stream your camera live to the Mayday dispatch dashboard.</p>
        <div class="f">
            <label>Camera Location</label>
            <select id="cam">
                <option value="cam-1">Drexel 33rd & Market</option>
                <option value="cam-2">SEPTA 30th St Station</option>
                <option value="cam-3">Rittenhouse Square</option>
                <option value="cam-4">Temple University Main</option>
            </select>
        </div>
        <div class="f">
            <label>Camera</label>
            <select id="face">
                <option value="environment">Back Camera</option>
                <option value="user">Front Camera</option>
            </select>
        </div>
        <button class="btn" id="go" onclick="startCamera()">Start Streaming</button>
        <p class="err hidden" id="err"></p>
    </div>

    <div class="vc hidden" id="live">
        <video id="vid" autoplay playsinline muted></video>
        <div class="badge"><div class="rd"></div> LIVE</div>
        <div class="cl" id="lbl">cam-1</div>
    </div>

    <script>
        var ws, pc, stream, room;

        function setSt(cls, txt) {
            document.getElementById('st').className = 'status ' + cls;
            document.getElementById('stTxt').textContent = txt;
        }

        async function startCamera() {
            var btn = document.getElementById('go');
            btn.disabled = true;
            btn.textContent = 'Starting...';

            room = document.getElementById('cam').value;
            var facing = document.getElementById('face').value;

            // Get camera
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: true
                });
                document.getElementById('vid').srcObject = stream;
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Start Streaming';
                document.getElementById('err').textContent = 'Camera error: ' + e.message;
                document.getElementById('err').classList.remove('hidden');
                return;
            }

            // Show live view
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('live').classList.remove('hidden');
            document.getElementById('lbl').textContent = room;
            setSt('wait', 'Connecting...');

            // Connect WebSocket for signaling
            var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(proto + '//' + location.host);

            ws.onopen = function () {
                ws.send(JSON.stringify({ type: 'join', room: room, role: 'sender' }));
                setSt('wait', 'Waiting for dashboard...');
            };

            ws.onmessage = function (evt) {
                var msg = JSON.parse(evt.data);

                if (msg.type === 'ready') {
                    startWebRTC();
                }
                if (msg.type === 'answer') {
                    pc.setRemoteDescription(new RTCSessionDescription(msg));
                }
                if (msg.type === 'candidate') {
                    pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                }
            };

            ws.onclose = function () {
                setSt('off', 'Disconnected');
                setTimeout(function () {
                    // Reconnect
                    ws = new WebSocket(proto + '//' + location.host);
                    ws.onopen = function () {
                        ws.send(JSON.stringify({ type: 'join', room: room, role: 'sender' }));
                        setSt('wait', 'Reconnecting...');
                    };
                    ws.onmessage = function (evt) {
                        var msg = JSON.parse(evt.data);
                        if (msg.type === 'ready') {
                            startWebRTC();
                        }
                        if (msg.type === 'answer') {
                            pc.setRemoteDescription(new RTCSessionDescription(msg));
                        }
                        if (msg.type === 'candidate') {
                            pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                        }
                    };
                    ws.onclose = arguments.callee;
                }, 2000);
            };
        }

        function startWebRTC() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            stream.getTracks().forEach(function (track) {
                pc.addTrack(track, stream);
            });

            pc.onicecandidate = function (e) {
                if (e.candidate) {
                    ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
                }
            };

            pc.createOffer().then(function (offer) {
                return pc.setLocalDescription(offer);
            }).then(function () {
                ws.send(JSON.stringify(pc.localDescription));
                setSt('live', 'LIVE');
            });
        }
    </script>
</body>
</html>
